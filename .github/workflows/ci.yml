name: CI

on:
  push:
    branches: [main, r2-ci]
    # A version tag publishes the GitHub release with the attested installer (job "release")
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Read-only by default; only the release job may write
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Runner labels are pinned (not *-latest) so an image migration never changes CI unannounced.
# bash runs with -e -o pipefail, also on Windows: a failed install stops the job at once.
defaults:
  run:
    shell: bash

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-26.04
    steps:
      # Actions pinned to a commit SHA; Dependabot proposes updates
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Install ruff (pinned in requirements-dev.txt)
        run: pip install "$(grep -oE '^ruff==[0-9.]+' requirements-dev.txt)"
      - name: ruff check
        run: ruff check --output-format=github .
      - name: ruff format
        run: ruff format --check .
      # The release job takes its notes from this section; a missing one fails here, not at tag time
      - name: Release notes for the current version
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          python .github/scripts/release_notes.py "$version" > release-notes.md
          { echo "### Release notes for $version (CHANGELOG.md)"; echo; cat release-notes.md; } >> "$GITHUB_STEP_SUMMARY"

  locks:
    name: Lock files match pyproject (uv)
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"
          enable-cache: false
      # Re-runs the command in each file's header; uv keeps the existing pins, so any difference means a file was
      # edited by hand or pyproject.toml changed without re-locking
      - name: Re-lock and compare
        run: |
          bash .github/scripts/lock.sh
          git diff --exit-code -- requirements.txt requirements-dev.txt packaging/requirements-build.txt

  test-windows:
    name: Tests (Windows, coverage)
    runs-on: windows-2025-vs2026
    needs: lint
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      # Exactly the locked versions, every file checked against its hash
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements-dev.txt
          pip install --no-deps -e .
      # Linux-only modules are excluded from the Windows coverage figure (coverage-windows.ini)
      - name: Run tests
        run: pytest tests -q --cov=hams --cov-report=term --cov-config=coverage-windows.ini

  test-linux:
    name: Tests (Linux, xvfb)
    runs-on: ubuntu-26.04
    needs: lint
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      # Tk needs an X server (xvfb); sounddevice needs PortAudio and, through it, a running sound server.
      # The runner has no sound card, so PulseAudio runs with a null sink.
      - name: System packages
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q xvfb libportaudio2 libpulse0 pulseaudio libxkbcommon0 libdbus-1-3
      - name: Start PulseAudio (null sink)
        run: |
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=ci_null
          pactl info | head -5
      - name: Install dependencies
        run: |
          pip install --require-hashes -r requirements-dev.txt
          pip install --no-deps -e .
      - name: Run tests
        run: xvfb-run -a python -m pytest tests -q -p no:cacheprovider --cov=hams --cov-report=term

  audit:
    name: Known vulnerabilities (pip-audit)
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: pip-audit
        run: |
          pip install pip-audit==2.10.1
          pip-audit -r requirements-dev.txt --no-deps --disable-pip

  build:
    name: Build package
    runs-on: ubuntu-26.04
    needs: [test-windows, test-linux]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Build sdist and wheel
        run: |
          pip install build==1.6.1
          python -m build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  installer:
    name: Windows installer (build + smoke test)
    runs-on: windows-2025-vs2026
    needs: lint
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      # Locked and hashed like the tests, without the [cuda] extra: the app downloads the CUDA libraries on demand
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements.txt
          pip install --require-hashes -r packaging/requirements-build.txt
          pip install --no-deps -e .
      - name: Check the tag matches the version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])"
          if ("v$version" -ne "${{ github.ref_name }}") { throw "Tag ${{ github.ref_name }} does not match pyproject version $version" }
      - name: Inno Setup
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          if (-not (Test-Path $iscc)) { throw "Inno Setup 6 not found" }
          "Inno Setup {0}" -f (Get-Item $iscc).VersionInfo.ProductVersion
      - name: Build app and installer
        shell: pwsh
        run: ./packaging/build.ps1 -Installer
      - name: Smoke test (silent install, self-test, silent uninstall)
        shell: pwsh
        run: ./packaging/smoke_test.ps1 -Setup (Get-Item build/installer/Hams-Setup-*.exe).FullName
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hams-setup-windows
          path: build/installer/Hams-Setup-*.exe
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: installer-smoke-logs
          path: build/smoke/
          if-no-files-found: ignore

  # The only way release assets are published: a tag push whose CI is green end to end. Never upload by hand.
  release:
    name: Publish release (notes, attested installer)
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/r2-ci'
    runs-on: ubuntu-26.04
    needs: [lint, locks, test-windows, test-linux, audit, build, installer]
    permissions:
      contents: write       # create the release, upload the installer
      id-token: write       # sign the provenance attestation (Sigstore)
      attestations: write   # store the attestation with the repository
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: hams-setup-windows
          path: release-assets
      # SLSA build provenance: proves the installer was built by this workflow from this tag.
      # Check a download with: gh attestation verify Hams-Setup-<version>.exe --repo <owner>/<repo>
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release-assets/Hams-Setup-*.exe
      - name: Release notes from CHANGELOG.md
        run: |
          python3 .github/scripts/release_notes.py "${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v1.1.0' }}" > release-notes.md
          cat release-notes.md >> "$GITHUB_STEP_SUMMARY"
          ls -l release-assets
      # A tag push alone produces the complete release; a release created beforehand only gets the asset
      - name: Create the release or attach to it
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s failglob
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release-assets/Hams-Setup-*.exe --clobber
          else
            gh release create "$GITHUB_REF_NAME" release-assets/Hams-Setup-*.exe --verify-tag \
              --title "Hams ${GITHUB_REF_NAME#v}" --notes-file release-notes.md
          fi
