name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Read-only: the run needs no write access to the repository
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      # Actions pinned to a commit SHA; Dependabot proposes updates
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install ruff (pinned in requirements-dev.txt)
        run: pip install "$(grep -oE '^ruff==[0-9.]+' requirements-dev.txt)"
      - name: ruff check
        run: ruff check --output-format=github .
      - name: ruff format
        run: ruff format --check .

  test-windows:
    name: Tests (Windows, coverage)
    runs-on: windows-latest
    needs: lint
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      # Exactly the locked versions, every file checked against its hash
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements-dev.txt
          pip install --no-deps -e .
      # Linux-only modules are excluded from the Windows coverage figure (abdeckung-windows.ini)
      - name: Run tests
        run: pytest tests -q --cov=wisper --cov-report=term --cov-config=abdeckung-windows.ini

  test-linux:
    name: Tests (Linux, xvfb)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      # Tk needs an X server (xvfb); sounddevice needs PortAudio and, through it, a running sound server.
      # The runner has no sound card, so PulseAudio runs with a null sink.
      - name: System packages
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q xvfb libportaudio2 libpulse0 pulseaudio libxkbcommon0 libdbus-1-3
      - name: Start PulseAudio (null sink)
        run: |
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=ci_null
          pactl info | head -5
      - name: Install dependencies
        run: |
          pip install --require-hashes -r requirements-dev.txt
          pip install --no-deps -e .
      - name: Run tests
        run: xvfb-run -a python -m pytest tests -q -p no:cacheprovider --cov=wisper --cov-report=term

  audit:
    name: Known vulnerabilities (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: pip-audit
        run: |
          pip install pip-audit==2.10.1
          pip-audit -r requirements-dev.txt --no-deps --disable-pip

  build:
    name: Build package
    runs-on: ubuntu-latest
    needs: [test-windows, test-linux]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Build sdist and wheel
        run: |
          pip install build==1.6.1
          python -m build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
