name: CI

on:
  push:
    branches: [main]
    # A version tag also attaches the installer to its GitHub release (job "release")
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Read-only by default; only the release job may write
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      # Actions pinned to a commit SHA; Dependabot proposes updates
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install ruff (pinned in requirements-dev.txt)
        run: pip install "$(grep -oE '^ruff==[0-9.]+' requirements-dev.txt)"
      - name: ruff check
        run: ruff check --output-format=github .
      - name: ruff format
        run: ruff format --check .

  test-windows:
    name: Tests (Windows, coverage)
    runs-on: windows-latest
    needs: lint
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      # Exactly the locked versions, every file checked against its hash
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements-dev.txt
          pip install --no-deps -e .
      # Linux-only modules are excluded from the Windows coverage figure (coverage-windows.ini)
      - name: Run tests
        run: pytest tests -q --cov=hams --cov-report=term --cov-config=coverage-windows.ini

  test-linux:
    name: Tests (Linux, xvfb)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      # Tk needs an X server (xvfb); sounddevice needs PortAudio and, through it, a running sound server.
      # The runner has no sound card, so PulseAudio runs with a null sink.
      - name: System packages
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q xvfb libportaudio2 libpulse0 pulseaudio libxkbcommon0 libdbus-1-3
      - name: Start PulseAudio (null sink)
        run: |
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=ci_null
          pactl info | head -5
      - name: Install dependencies
        run: |
          pip install --require-hashes -r requirements-dev.txt
          pip install --no-deps -e .
      - name: Run tests
        run: xvfb-run -a python -m pytest tests -q -p no:cacheprovider --cov=hams --cov-report=term

  audit:
    name: Known vulnerabilities (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: pip-audit
        run: |
          pip install pip-audit==2.10.1
          pip-audit -r requirements-dev.txt --no-deps --disable-pip

  build:
    name: Build package
    runs-on: ubuntu-latest
    needs: [test-windows, test-linux]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Build sdist and wheel
        run: |
          pip install build==1.6.1
          python -m build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  installer:
    name: Windows installer (build + smoke test)
    runs-on: windows-latest
    needs: lint
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      # Locked and hashed like the tests, without the [cuda] extra: the app downloads the CUDA libraries on demand
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements.txt
          pip install --require-hashes -r packaging/requirements-build.txt
          pip install --no-deps -e .
      - name: Check the tag matches the version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])"
          if ("v$version" -ne "${{ github.ref_name }}") { throw "Tag ${{ github.ref_name }} does not match pyproject version $version" }
      - name: Inno Setup
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          if (-not (Test-Path $iscc)) { throw "Inno Setup 6 not found" }
          "Inno Setup {0}" -f (Get-Item $iscc).VersionInfo.ProductVersion
      - name: Build app and installer
        shell: pwsh
        run: ./packaging/build.ps1 -Installer
      - name: Smoke test (silent install, self-test, silent uninstall)
        shell: pwsh
        run: ./packaging/smoke_test.ps1 -Setup (Get-Item build/installer/Hams-Setup-*.exe).FullName
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hams-setup-windows
          path: build/installer/Hams-Setup-*.exe
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: installer-smoke-logs
          path: build/smoke/
          if-no-files-found: ignore

  release:
    name: Attach installer to GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [installer, test-windows, test-linux]
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: hams-setup-windows
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: "Hams-Setup-*.exe"