name: Secret scan

# On every push: is there a key or password anywhere in the history?
on:
  push:
    branches: [main, r2-ci]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 5 * * 1"   # Mondays, in case new detection rules appear

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # the whole history, not just the latest state

      # Fixed version, verified against the published checksum
      - name: Download gitleaks
        env:
          VERSION: 8.30.1
          SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -sSfL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
          echo "${SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks

      - name: Scan history
        run: ./gitleaks git . --redact --no-banner --exit-code 1
