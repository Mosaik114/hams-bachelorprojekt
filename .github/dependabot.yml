# Proposes newer GitHub Actions (pinned by commit SHA) once a week.
# Python dependencies are not handled here: Dependabot cannot re-resolve the hash-locked, uv-compiled requirement
# files, so a bump that adds a dependency breaks `pip install --require-hashes`. The workflow
# .github/workflows/lock-refresh.yml re-locks all of them together instead (see CONTRIBUTING.md).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
