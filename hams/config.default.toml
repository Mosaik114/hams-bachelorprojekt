# Hams — mitgelieferte Voreinstellungen
#
# Diese Datei ist die Vorlage, nicht die persönliche Konfiguration. Hams legt
# beim ersten Start eine eigene Datei unter
#
#     %APPDATA%\Hams\config.toml        (Windows)
#     ~/.config/hams/config.toml        (Linux)
#
# an und schreibt jede Änderung aus den Einstellungen nur noch dorthin. Hier
# stehen deshalb ausschliesslich Voreinstellungen und keine Nutzerwahl.
#
# Alle Felder sind optional. Was hier fehlt, kommt aus den Defaults in config.py;
# was in der Nutzerdatei fehlt, kommt aus dieser Vorlage.

[audio]
# Aufgenommen wird immer mit 16 kHz mono – das braucht Whisper.
# Mikrofon: "default" für System-Standard, sonst Index (z. B. 3) oder ein
# Teilstring des Gerätenamens (z. B. "Yeti"). Die tatsächliche Wahl trifft der
# Nutzer in den Einstellungen; sie landet in der Nutzerkonfiguration.
device = "default"
# Max. Aufnahmedauer in Sekunden, danach wird automatisch gestoppt.
max_recording_seconds = 300

[model]
size = "turbo"
# Geräte-Reihenfolge beim Laden: das erste, das sich laden lässt, wird genutzt.
# ["cpu"] lässt die Grafikkarte frei.
device_priority = ["cuda", "cpu"]

[transcription]
# Diktiersprache / dictation language: "auto" (Whisper erkennt sie bei jeder
# Aufnahme), "de", "en", "fr", "es", "it", "nl", "pl" oder "pt".
# Ohne Eintrag folgt sie der Sprache der Oberfläche: Deutsch auf einem
# deutschen System, sonst Englisch. Umgestellt wird in den Einstellungen unter
# Transkription; Hams schreibt die Wahl dann in die Nutzerkonfiguration.
# language = "de"
# Stille vor der Erkennung herausschneiden (Silero VAD).
vad_filter = true

[hotkeys]
transcript = "ctrl+shift+space"
prompt = "ctrl+shift+alt+space"

[ollama]
# Bewusst die Zahlenadresse und nicht "localhost": auf Windows loest
# "localhost" zuerst zu ::1 auf, wo Ollama in der Voreinstellung nicht
# lauscht. Der tote Versuch kostet gemessen 2,03 s vor *jedem* Aufruf.
# Wer eine Ollama-Instanz nur auf IPv6 betreibt, traegt hier [::1] ein.
url = "http://127.0.0.1:11434/api/generate"
# Cleanup- und Prompt-Modell werden in den Einstellungen gewählt und in der
# Nutzerkonfiguration abgelegt. Ein bestimmtes Modell hier vorzugeben hiesse
# anzunehmen, dass es auf dem Rechner installiert ist. Steht nirgends etwas,
# gilt die Voreinstellung im Code: qwen3.5:9b (`ollama pull qwen3.5:9b`).
# model_transcript_cleanup = "qwen3.5:9b"
# model_prompt_generate = "qwen3.5:9b"
timeout_cleanup = 30
timeout_prompt = 60
# Sampling-Temperatur der Bereinigung (0 bis 2). 0 liefert für dasselbe Diktat immer denselben Text
# und erfindet gemessen seltener etwas (docs/evaluation.md). Der Prompt-Modus nutzt die Modellvorgaben.
cleanup_temperature = 0
# Cleanup komplett abschalten → Whisper-Rohtext wird direkt eingefügt (maximal schnell).
cleanup_enabled = true
# Hält das Modell nach Gebrauch im VRAM, damit der nächste Request nicht nachladen muss.
# "30m", "1h", "-1" (unbegrenzt) oder "0" (sofort entladen) — siehe Ollama-Doku.
keep_alive = "30m"
# Datei relativ zum Projekt mit dem Cleanup-Prompt. {text} wird durch das Transkript ersetzt.
cleanup_prompt_file = "prompts/cleanup.txt"

[clipboard]
# Max. Wartezeit (Sekunden), bis die Zwischenablage den neuen Inhalt bestätigt.
paste_timeout = 0.3

[output]
# Jeden eingefügten Text zusätzlich als Datei unter %LOCALAPPDATA%\Hams\transcripts
# (Linux: ~/.local/share/hams/transcripts) speichern. Aus: die letzten fünf Texte
# stehen trotzdem im Tray-Menü, aber nur bis zum Beenden. Umgestellt wird auch in
# den Einstellungen unter Allgemein.
save_transcripts = false
# Gespeicherte Transkripte nach so vielen Tagen löschen (beim Start und nach jedem
# Speichern); 0 behält sie für immer.
keep_days = 30

[ui]
# Sound-Feedback (Beeps) bei Start/Stop aktivieren.
sound_feedback = true
# Darstellungsmodus: "light" oder "dark". Voreinstellung ist hell.
# Umgestellt wird im Einstellungsfenster unter Allgemein; Hams schreibt
# die Wahl dann in die Nutzerkonfiguration, nicht hierher.
appearance = "light"
# Sprache der Oberfläche / interface language: "auto", "de" oder "en".
# "auto" folgt der Systemsprache: Deutsch auf einem deutschen System, sonst
# Englisch. Eine Änderung gilt nach einem Neustart von Hams.
language = "auto"
# Die zuletzt gemerkte Fensterposition (window_x, window_y) und ob der
# Hinweis „läuft im Tray weiter“ schon kam (tray_hint_shown) schreibt Hams
# selbst in die Nutzerkonfiguration — hier haben sie nichts zu suchen.

[updates]
# Einmal am Tag beim Start fragt Hams bei GitHub (api.github.com) nach, ob es
# eine neue Version gibt, und zeigt dann einen Hinweis mit Link zur
# Release-Seite. Heruntergeladen wird nie etwas. false schaltet die Abfrage ab
# (auch in den Einstellungen unter Allgemein).
check = true

[integrations]
# Optional: Aufnahmezustand und Pegel an ein separates Overlay-Werkzeug melden, das
# einen Aufnahmepunkt am Mauszeiger zeigt (siehe hams/cursor_dot.py). Bleibt alles
# auf dem Rechner; aus heisst: es wird nichts gesendet.
cursor_dot = false
