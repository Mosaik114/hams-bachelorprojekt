# Abdeckung der Windows-CI (.github/workflows/ci.yml): die reinen Linux-Module laufen unter Windows nicht und
# zählten dort mit 0 % (28.09.: 84 % statt ~90 %). Unter Linux misst die Linux-CI sie mit (pyproject.toml).
[run]
omit =
    wisper/linux.py
    wisper/portal_hotkeys.py

[report]
fail_under = 85
