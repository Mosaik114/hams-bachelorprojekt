[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hams"
version = "1.1.2"
description = "Local, privacy-first voice input for Windows and Linux: faster-whisper speech recognition with optional LLM cleanup via Ollama, pasted wherever your cursor is."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "Mazgin Abdulwahed Ahmad"}
]
keywords = ["speech-to-text", "dictation", "whisper", "faster-whisper", "ollama", "local-llm", "voice-input"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Win32 (MS Windows)",
    "Environment :: X11 Applications",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: German",
    "Operating System :: Microsoft :: Windows :: Windows 10",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "faster-whisper>=1.1.0",
    "numpy>=1.26.0",
    "pyperclip>=1.9.0",
    "sounddevice>=0.4.6",
    "keyboard>=0.13.5; sys_platform == 'win32'",
    "pystray>=0.19.5",
    "Pillow>=10.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "ruff",
]
# Fuer die Transkription auf der GPU. ctranslate2 braucht cuBLAS und cuDNN,
# bringt sie aber nicht mit. Auf einer gewachsenen Installation liefert sie
# meist torch als Nebenwirkung - gemessen 4337 MB, von denen 1712 MB die
# Bibliotheken sind und der Rest ungenutzt bleibt. Einzeln installiert sind
# es 1981 MB, und die Gesamtumgebung schrumpft von 6620 MB auf 2280 MB.
# Ohne diese Pakete (und ohne torch) laeuft Hams auf der CPU weiter.
cuda = [
    "nvidia-cublas-cu12",
    "nvidia-cudnn-cu12",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

# Coverage gate for the Linux CI job: line and branch coverage together; the run fails below it.
# It is lower than the Windows gate (93 %, coverage-windows.ini) because the Windows-only modules count here
# but mostly cannot run on Linux (measured 89.8 % with branches).
[tool.coverage.run]
branch = true

[tool.coverage.report]
fail_under = 88

[project.scripts]
hams = "hams.cli:run"

[project.urls]
Homepage = "https://github.com/Mosaik114/hams-bachelorprojekt"
Repository = "https://github.com/Mosaik114/hams-bachelorprojekt"
Changelog = "https://github.com/Mosaik114/hams-bachelorprojekt/blob/main/CHANGELOG.md"
Documentation = "https://github.com/Mosaik114/hams-bachelorprojekt/tree/main/docs"

[tool.setuptools]
packages = ["hams", "hams.ui_kit", "hams.prompts"]

[tool.setuptools.package-data]
hams = ["prompts/*.txt", "*.toml", "assets/branding/*"]

# Linter- und Formatregeln: ruff.toml
