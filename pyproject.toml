[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wisper"
version = "0.1.0"
description = "Always-on-top Sprach-zu-Text Tool für Windows mit Transkription und Prompt-Modus"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Mosaik114"}
]
keywords = ["speech-to-text", "transcription", "voice", "whisper", "ollama"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
    "faster-whisper>=1.1.0",
    "numpy>=1.26.0",
    "pyperclip>=1.9.0",
    "sounddevice>=0.4.6",
    "keyboard>=0.13.5; sys_platform == 'win32'",
    "pystray>=0.19.5",
    "Pillow>=10.0.0",
    "tomli>=2.0.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "ruff",
]
# Fuer die Transkription auf der GPU. ctranslate2 braucht cuBLAS und cuDNN,
# bringt sie aber nicht mit. Auf einer gewachsenen Installation liefert sie
# meist torch als Nebenwirkung - gemessen 4337 MB, von denen 1712 MB die
# Bibliotheken sind und der Rest ungenutzt bleibt. Einzeln installiert sind
# es 1981 MB, und die Gesamtumgebung schrumpft von 6620 MB auf 2280 MB.
# Ohne diese Pakete (und ohne torch) laeuft Wisper auf der CPU weiter.
cuda = [
    "nvidia-cublas-cu12",
    "nvidia-cudnn-cu12",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

# Untergrenze fuer die CI: faellt die Abdeckung darunter, schlaegt der Lauf fehl.
[tool.coverage.report]
fail_under = 85

[project.scripts]
wisper = "wisper.main:main"

[project.urls]
Homepage = "https://github.com/Mosaik114/Mosaiks-Desktop/tree/main/Hams"
Repository = "https://github.com/Mosaik114/Mosaiks-Desktop"

[tool.setuptools]
packages = ["wisper", "wisper.ui_kit"]

[tool.setuptools.package-data]
wisper = ["prompts/*.txt"]

[tool.ruff]
# Regeln: gemeinsame ../ruff.toml an der Wurzel (Qualitätsplan Q2)
extend = "../ruff.toml"
target-version = "py310"   # Hams läuft auch unter Windows mit älterem Python

[tool.ruff.lint.extend-per-file-ignores]
# E402 ist in main.py unvermeidlich und beabsichtigt: der Projekt-Root muss
# *vor* den uebrigen Importen in sys.path, damit der direkte Skriptstart aus
# dem Autostart-VBS die Package-Importe darunter ueberhaupt findet. (Der
# zweite Fall, preload_backend_without_torch() vor faster-whisper, steht in
# backend.py und ist dort an der einen Zeile vermerkt.)
"wisper/main.py" = ["E402"]
# Das Paket ui_kit bietet die Namen seiner Module gesammelt an; sie werden
# dort importiert, um weitergereicht zu werden, nicht um benutzt zu werden.
"wisper/ui_kit/__init__.py" = ["F401"]
