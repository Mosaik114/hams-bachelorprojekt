[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wisper"
version = "0.1.0"
description = "Always-on-top Sprach-zu-Text Tool für Windows mit Transkription und Prompt-Modus"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Mazgin Abdulwahed Ahmad"}
]
keywords = ["speech-to-text", "transcription", "voice", "whisper", "ollama"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
    "faster-whisper>=1.1.0",
    "numpy>=1.26.0",
    "pyperclip>=1.9.0",
    "sounddevice>=0.4.6",
    "keyboard>=0.13.5",
    "pystray>=0.19.5",
    "Pillow>=10.0.0",
    "tomli>=2.0.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff",
]
# Fuer die Transkription auf der GPU. ctranslate2 braucht cuBLAS und cuDNN,
# bringt sie aber nicht mit. Auf einer gewachsenen Installation liefert sie
# meist torch als Nebenwirkung - gemessen 4337 MB, von denen 1712 MB die
# Bibliotheken sind und der Rest ungenutzt bleibt. Einzeln installiert sind
# es 1981 MB, und die Gesamtumgebung schrumpft von 6620 MB auf 2280 MB.
# Ohne diese Pakete (und ohne torch) laeuft Wisper auf der CPU weiter.
cuda = [
    "nvidia-cublas-cu12",
    "nvidia-cudnn-cu12",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[project.scripts]
wisper = "wisper.main:main"

[project.urls]
Homepage = "https://github.com/Mosaik114/hams-bachelorprojekt"
Repository = "https://github.com/Mosaik114/hams-bachelorprojekt"

[tool.setuptools]
packages = ["wisper"]

[tool.setuptools.package-data]
wisper = ["prompts/*.txt"]

[tool.ruff]
# Ohne diesen Abschnitt entscheidet die installierte Ruff-Version, was geprueft
# wird — und ihre Voreinstellung aendert sich zwischen Versionen. Der
# Lint-Schritt der CI schlaegt dann irgendwann fehl, ohne dass jemand Code
# angefasst haette. Festgehalten ist deshalb ruffs dokumentierte
# Standardauswahl: Fehler (E), Syntax (E9) und Pyflakes (F).
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# E402 ist in main.py unvermeidlich und beabsichtigt. Zwei Dinge muessen dort
# *vor* den uebrigen Importen laufen:
#   1. der Projekt-Root in sys.path, damit der direkte Skriptstart aus dem
#      Autostart-VBS die Package-Importe darunter ueberhaupt findet,
#   2. preload_backend_without_torch(), das sonst zu spaet kaeme — faster-
#      whisper zieht dann torch mit und der Start kostet 1,5 s mehr.
# Beides ist an Ort und Stelle begruendet.
"wisper/main.py" = ["E402"]
