[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hams"
version = "1.3.5"
description = "Local, privacy-first voice input for Windows and Linux: faster-whisper speech recognition with optional LLM cleanup via Ollama, pasted wherever your cursor is."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "Mazgin Abdulwahed Ahmad"}
]
keywords = ["speech-to-text", "dictation", "whisper", "faster-whisper", "ollama", "local-llm", "voice-input"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Win32 (MS Windows)",
    "Environment :: X11 Applications",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: German",
    "Operating System :: Microsoft :: Windows :: Windows 10",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "faster-whisper>=1.1.0",
    "numpy>=1.26.0",
    "pyperclip>=1.9.0",
    "sounddevice>=0.4.6",
    "keyboard>=0.13.5; sys_platform == 'win32'",
    "pystray>=0.19.5",
    "Pillow>=10.0.0",
    "tomlkit>=0.13",
    # Model downloads check HTTPS against the system certificate store (antivirus and company networks).
    "truststore>=0.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "ruff",
]
# Fuer die Transkription auf der GPU. ctranslate2 braucht cuBLAS und cuDNN,
# bringt sie aber nicht mit. Auf einer gewachsenen Installation liefert sie
# meist torch als Nebenwirkung - gemessen 4337 MB, von denen 1712 MB die
# Bibliotheken sind und der Rest ungenutzt bleibt. Einzeln installiert sind
# es 1981 MB, und die Gesamtumgebung schrumpft von 6620 MB auf 2280 MB.
# Ohne diese Pakete (und ohne torch) laeuft Hams auf der CPU weiter.
cuda = [
    "nvidia-cublas-cu12",
    "nvidia-cudnn-cu12",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

# Coverage gate for the Linux CI job: line and branch coverage together; the run fails below it.
# It is lower than the Windows gate (93 %, .github/coverage-windows.ini) because the Windows-only modules count here
# but mostly cannot run on Linux (measured 89.8 % with branches).
[tool.coverage.run]
branch = true

[tool.coverage.report]
fail_under = 88

[project.scripts]
hams = "hams.cli:run"

[project.urls]
Homepage = "https://github.com/Mosaik114/hams-bachelorprojekt"
Repository = "https://github.com/Mosaik114/hams-bachelorprojekt"
Changelog = "https://github.com/Mosaik114/hams-bachelorprojekt/blob/main/CHANGELOG.md"
Documentation = "https://github.com/Mosaik114/hams-bachelorprojekt/tree/main/docs"

[tool.setuptools]
packages = ["hams", "hams.ui_kit", "hams.prompts"]

[tool.setuptools.package-data]
hams = ["prompts/*.txt", "*.toml", "assets/branding/*", "assets/fonts/*"]

# Lint and format rules. The rule selection is fixed here because ruff changes its defaults between versions.
[tool.ruff]
line-length = 120
target-version = "py311"   # same as requires-python above
extend-exclude = ["**/.venv", "**/*.egg-info", "tools/_korpus"]

[tool.ruff.lint]
select = [
    "E", "W",   # style and syntax (pycodestyle)
    "F",        # real errors: unused names, broken imports (Pyflakes)
    "B",        # likely bugs (flake8-bugbear)
    "SIM",      # simpler forms
    "C90",      # complexity (at most 10 branches per function)
    "I",        # import order
    "UP",       # current Python idioms
    "S",        # security (bandit)
]
ignore = [
    # Programs without a full path (S607) and subprocess without a shell (S603): on Linux, Hams deliberately calls
    # systemctl, wl-copy and friends from PATH; there is no outside input there.
    "S603", "S607",
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
# assert is exactly right in tests; so are dummy paths and identifiers
"tests/**" = ["S101", "S105", "S106", "S108"]
# Fixtures imported from appearance_support.py: the test parameters share their names (pytest requires it)
"tests/test_appearance*.py" = ["F811"]
# E402 is intended in main.py: the project root must be on sys.path before the other imports, so that the direct
# script start from the autostart VBS finds the package imports below.
"hams/main.py" = ["E402"]
# The ui_kit package re-exports the names of its modules; they are only passed through there.
"hams/ui_kit/__init__.py" = ["F401"]
# Measurement tools: start PowerShell for speech output and import after the sys.path entry
"tools/*.py" = ["E402", "S101", "S311"]

[tool.ruff.format]
# One consistent style (ruff format); quotes stay as they are
quote-style = "preserve"
